spring:
    application:
        name: auth
    server:
        port: ${APP_PORT:8080}
    mvc:
        throw-exception-if-no-handler-found: true
    web:
        resources:
            add-mappings: false
    profiles:
        active: ${APP_ENV:local}

    jpa:
        hibernate:
            ddl-auto: none
        show-sql: false

jwt:
    issuer: www.putraawali.com
